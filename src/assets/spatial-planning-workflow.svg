<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Spatial planning workflow diagram">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .frame { fill: none; stroke: #e5e7eb; stroke-width: 2; }
      .title { font: 700 22px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0f172a; }
      .muted { font: 500 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #64748b; }
      .stepTitle { font: 800 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0f172a; }
      .stepText { font: 500 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #475569; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="450" rx="18" />
  <rect class="frame" x="18" y="18" width="764" height="414" rx="16" />

  <text class="title" x="44" y="70">Spatial planning workflow</text>
  <text class="muted" x="44" y="96">Short, auditable steps from question -&gt; options -&gt; decision-ready outputs</text>

  <!-- Cards -->
  <g transform="translate(44,150)">
    <rect class="card" x="0" y="0" width="140" height="150" rx="16" />
    <text class="stepTitle" x="18" y="36">1) Define</text>
    <text class="stepText" x="18" y="62">Objective</text>
    <text class="stepText" x="18" y="82">AOI + criteria</text>
    <text class="stepText" x="18" y="102">Stakeholders</text>

    <rect class="card" x="160" y="0" width="140" height="150" rx="16" />
    <text class="stepTitle" x="178" y="36">2) Data QA</text>
    <text class="stepText" x="178" y="62">Clean layers</text>
    <text class="stepText" x="178" y="82">Align CRS</text>
    <text class="stepText" x="178" y="102">Fill gaps</text>

    <rect class="card" x="320" y="0" width="140" height="150" rx="16" />
    <text class="stepTitle" x="338" y="36">3) Model</text>
    <text class="stepText" x="338" y="62">Suitability</text>
    <text class="stepText" x="338" y="82">Access/time</text>
    <text class="stepText" x="338" y="102">Risk checks</text>

    <rect class="card" x="480" y="0" width="140" height="150" rx="16" />
    <text class="stepTitle" x="498" y="36">4) Compare</text>
    <text class="stepText" x="498" y="62">Scenarios</text>
    <text class="stepText" x="498" y="82">Trade-offs</text>
    <text class="stepText" x="498" y="102">Sensitivity</text>

    <rect class="card" x="640" y="0" width="140" height="150" rx="16" />
    <text class="stepTitle" x="658" y="36">5) Package</text>
    <text class="stepText" x="658" y="62">Maps</text>
    <text class="stepText" x="658" y="82">GIS handover</text>
    <text class="stepText" x="658" y="102">Decision brief</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M 190 225 L 200 225" marker-end="url(#arrowHead)" />
  <path class="arrow" d="M 350 225 L 360 225" marker-end="url(#arrowHead)" />
  <path class="arrow" d="M 510 225 L 520 225" marker-end="url(#arrowHead)" />
  <path class="arrow" d="M 670 225 L 680 225" marker-end="url(#arrowHead)" />

  <!-- Footer note -->
  <g transform="translate(44,342)">
    <rect x="0" y="0" width="736" height="64" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <text class="stepTitle" x="18" y="28">Result</text>
    <text class="stepText" x="18" y="48">A short, defensible recommendation that can be implemented and monitored.</text>
  </g>
</svg>

